---
name: "Release and Publish"

on:
  push:
    tags:
      - "2.9.0-management.*"

permissions:
  contents: write
  packages: write

jobs:
  management-v1:
    uses: ./.github/workflows/management-v1.yml

  release:
    needs: management-v1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Verify immutable version set
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$(jq -r .release_version MANAGEMENT_VERSION_SET.json)" = "$TAG"
          test "$(jq -r .source_baseline MANAGEMENT_VERSION_SET.json)" = "2.9.0"
          test "$(jq -r .platform MANAGEMENT_VERSION_SET.json)" = "linux/amd64"
          test "$(cat console/service/VERSION)" = "$TAG"
          test "$(jq -r .version console/ui/package.json)" = "$TAG"
          grep -qx "  version: $TAG" console/service/api/swagger.yaml
          git diff --exit-code

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish management images
        env:
          TAG: ${{ github.ref_name }}
          DOCKER_PLATFORMS: linux/amd64
          DOCKER_REGISTRY_USER: ${{ github.actor }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: make docker-push-management

      - name: Generate release manifest
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          image_digest() {
            docker buildx imagetools inspect "$1" | awk '/^Digest:/ {print $2; exit}'
          }
          UI_DIGEST="$(image_digest "ghcr.io/erhuz/console_ui:$TAG")"
          API_DIGEST="$(image_digest "ghcr.io/erhuz/console_api:$TAG")"
          AUTOMATION_DIGEST="$(image_digest "ghcr.io/erhuz/automation:$TAG")"
          DB_DIGEST="$(jq -r .components.console_db.digest MANAGEMENT_VERSION_SET.json)"
          MIGRATION_HEAD="$(jq -r .components.console_db.migration_head MANAGEMENT_VERSION_SET.json)"
          jq -n \
            --arg release "$TAG" \
            --arg base "2.9.0" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg platform "linux/amd64" \
            --arg ui_digest "$UI_DIGEST" \
            --arg api_digest "$API_DIGEST" \
            --arg db_digest "$DB_DIGEST" \
            --arg automation_digest "$AUTOMATION_DIGEST" \
            --argjson migration_head "$MIGRATION_HEAD" \
            '{
              schema: 1,
              release: $release,
              base: $base,
              source_commit: $source_commit,
              migration_head: $migration_head,
              platform: $platform,
              components: {
                ui: {image: "ghcr.io/erhuz/console_ui", digest: $ui_digest},
                api: {image: "ghcr.io/erhuz/console_api", digest: $api_digest},
                console_db: {image: "autobase/console_db", digest: $db_digest},
                automation: {image: "ghcr.io/erhuz/automation", digest: $automation_digest}
              }
            }' > release-manifest.json
          jq -e --arg release "$TAG" '
            .release == $release
            and .base == "2.9.0"
            and .platform == "linux/amd64"
            and ([.components[].digest | startswith("sha256:")] | all)
          ' release-manifest.json

      - name: Verify anonymous pulls
        run: |
          docker logout ghcr.io || true
          jq -r '
            .components[]
            | select(.image | startswith("ghcr.io/"))
            | "\(.image)@\(.digest)"
          ' release-manifest.json |
            while read -r image; do
              docker buildx imagetools inspect "$image"
            done

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: management-version-set
          path: release-manifest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-manifest.json --verify-tag --title "$TAG" --notes "Direct upgrade from Autobase Community 2.9.0."
