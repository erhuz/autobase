---
- name: Verify operation credential gate contract
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read credential gate sources
      ansible.builtin.set_fact:
        credential_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/pre_checks/tasks/operation_credentials.yml') }}"
        query_analytics: "{{ lookup('ansible.builtin.file', playbook_dir + '/../playbooks/query_analytics.yml') }}"
        restart: "{{ lookup('ansible.builtin.file', playbook_dir + '/../playbooks/restart_pgcluster.yml') }}"
        restore: "{{ lookup('ansible.builtin.file', playbook_dir + '/../playbooks/restore_pgcluster.yml') }}"
        phase2: "{{ lookup('ansible.builtin.file', playbook_dir + '/../playbooks/phase2_pgcluster.yml') }}"

    - name: Require fail-closed authentication and live Patroni authority
      ansible.builtin.assert:
        that:
          - "'postgres_superuser' in credential_tasks"
          - "'postgres_replication' in credential_tasks"
          - "'patroni_restapi' in credential_tasks"
          - "'select 1' in credential_tasks"
          - "'IDENTIFY_SYSTEM' in credential_tasks"
          - "'/config' in credential_tasks"
          - "credential_tasks | regex_findall('no_log: true') | length == 5"
          - "'Read live Patroni identity before mutation' in credential_tasks"
          - "'operation_patroni_identity.json.patroni.scope' in credential_tasks"
          - "'operation_patroni_identity.json.patroni.name' in credential_tasks"
          - "'Bind live Patroni scope' in credential_tasks"
          - "credential_tasks | regex_findall('operation_patroni_scope') | length >= 6"
          - scope_guard in credential_tasks
          - "'Effective Patroni scope' in credential_tasks"
          - "'Recheck live Patroni DCS topology before mutation' in credential_tasks"
          - leader_gate in credential_tasks
          - "'operation_patroni_dcs_names == operation_patroni_expected_names' in credential_tasks"
          - "'members=' in credential_tasks"
          - "'roles=' in credential_tasks"
          - "query_analytics.index('tasks_from: operation_credentials') < query_analytics.index('Read Patroni cluster topology')"
          - "restart.index('tasks_from: operation_credentials') < restart.index('Require healthy Patroni member')"
          - "phase2.index('import_playbook: operation_credentials.yml') < phase2.index('import_playbook: update_pgcluster.yml')"
          - "restore.index('Validate credentials before bootstrap') < restore.index('Run native point-in-time recovery')"
          - "restore.index('Authenticate restored services') < restore.index('Verify isolated recovery')"
      vars:
        leader_gate: "operation_patroni_dcs_members | selectattr('Role', 'equalto', 'Leader') | list | length == 1"
        scope_guard: "patroni_cluster_name == operation_patroni_scope"

    - name: Require every mutating wrapper to import the gate
      ansible.builtin.assert:
        that:
          - "'import_playbook: operation_credentials.yml' in wrapper"
      loop:
        - lifecycle_pgcluster.yml
        - phase2_pgcluster.yml
        - database_admin.yml
        - phase3_services.yml
        - restore_pgcluster.yml
      loop_control:
        loop_var: wrapper_name
      vars:
        wrapper: "{{ lookup('ansible.builtin.file', playbook_dir + '/../playbooks/' + wrapper_name) }}"

    - name: Require direct Patroni mutation playbooks to import the gate
      ansible.builtin.assert:
        that:
          - "'tasks_from: operation_credentials' in direct_wrapper"
      loop:
        - query_analytics.yml
        - reinit_replica.yml
        - reload_pgcluster.yml
        - restart_pgcluster.yml
        - switchover_pgcluster.yml
      loop_control:
        loop_var: direct_wrapper_name
      vars:
        direct_wrapper: "{{ lookup('ansible.builtin.file', playbook_dir + '/../playbooks/' + direct_wrapper_name) }}"
