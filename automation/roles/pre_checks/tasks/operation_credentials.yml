---
- name: Validate declared operation credentials
  ansible.builtin.assert:
    that:
      - operation_required_credentials | default([]) | difference(['postgres_superuser', 'postgres_replication', 'patroni_restapi']) | length == 0
      - "'postgres_superuser' not in operation_required_credentials | default([]) or patroni_superuser_username | default('') | length > 0"
      - "'postgres_superuser' not in operation_required_credentials | default([]) or patroni_superuser_password | default('') | length > 0"
      - "'postgres_replication' not in operation_required_credentials | default([]) or patroni_replication_username | default('') | length > 0"
      - "'postgres_replication' not in operation_required_credentials | default([]) or patroni_replication_password | default('') | length > 0"
      - "'patroni_restapi' not in operation_required_credentials | default([]) or patroni_restapi_username | default('') | length > 0"
      - "'patroni_restapi' not in operation_required_credentials | default([]) or patroni_restapi_password | default('') | length > 0"
  no_log: true

- name: Authenticate PostgreSQL superuser before mutation
  become_user: postgres
  ansible.builtin.command:
    argv:
      - "{{ postgresql_bin_dir }}/psql"
      - -h
      - "127.0.0.1"
      - -p
      - "{{ postgresql_port | string }}"
      - -U
      - "{{ patroni_superuser_username }}"
      - -d
      - postgres
      - -tAXc
      - select 1
  environment:
    PGPASSWORD: "{{ patroni_superuser_password }}"
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - "'postgres_superuser' in operation_required_credentials | default([])"
    - not operation_credentials_validate_only | default(false) | bool
    - not new_node | default(false) | bool

- name: Authenticate PostgreSQL replication role before mutation
  become_user: postgres
  ansible.builtin.command:
    argv:
      - "{{ postgresql_bin_dir }}/psql"
      - "--dbname=host=127.0.0.1 port={{ postgresql_port }} dbname=postgres user={{ patroni_replication_username }} replication=database"
      - -tAXc
      - IDENTIFY_SYSTEM
  environment:
    PGPASSWORD: "{{ patroni_replication_password }}"
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - "'postgres_replication' in operation_required_credentials | default([])"
    - not operation_credentials_validate_only | default(false) | bool
    - not new_node | default(false) | bool

- name: Authenticate Patroni REST API before mutation
  ansible.builtin.uri:
    url: >-
      {{ patroni_restapi_protocol | default('https') }}://{{ patroni_restapi_connect_addr
        | default(patroni_bind_address | default(bind_address, true), true) }}:{{ patroni_restapi_port
        | default('8008') }}/config
    user: "{{ patroni_restapi_username }}"
    password: "{{ patroni_restapi_password }}"
    force_basic_auth: true
    status_code: 200
    ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
  environment:
    no_proxy: "{{ patroni_restapi_connect_addr | default(patroni_bind_address | default(bind_address, true), true) }}"
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - "'patroni_restapi' in operation_required_credentials | default([])"
    - not operation_credentials_validate_only | default(false) | bool
    - not new_node | default(false) | bool

- name: Select current Patroni members
  ansible.builtin.add_host:
    name: "{{ item }}"
    groups: operation_patroni_members
  loop: "{{ groups.get('postgres_cluster', []) }}"
  when:
    - not operation_credentials_validate_only | default(false) | bool
    - not hostvars[item].new_node | default(false) | bool
  changed_when: false
  check_mode: false
  run_once: true # noqa run-once

- name: Read live Patroni identity before mutation
  ansible.builtin.uri:
    url: >-
      {{ patroni_restapi_protocol | default('https') }}://{{ patroni_restapi_connect_addr
        | default(patroni_bind_address | default(bind_address, true), true) }}:{{ patroni_restapi_port
        | default('8008') }}/patroni
    user: "{{ patroni_restapi_username | default(omit) }}"
    password: "{{ patroni_restapi_password | default(omit) }}"
    force_basic_auth: "{{ patroni_restapi_username | default('') | length > 0 }}"
    status_code: 200
    ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
  register: operation_patroni_identity
  environment:
    no_proxy: "{{ patroni_restapi_connect_addr | default(patroni_bind_address | default(bind_address, true), true) }}"
  changed_when: false
  check_mode: false
  no_log: true
  when: inventory_hostname in groups.get('operation_patroni_members', [])

- name: Require one live Patroni scope across current members
  ansible.builtin.assert:
    that:
      - operation_patroni_scopes | length == groups.get('operation_patroni_members', []) | length
      - operation_patroni_scopes | reject('equalto', '') | unique | list | length == 1
      - operation_patroni_names | reject('equalto', '') | unique | list | length
        == groups.get('operation_patroni_members', []) | length
    fail_msg: Current Patroni members do not agree on one live scope and unique member names.
  vars:
    operation_patroni_scopes: >-
      {{
        groups.get('operation_patroni_members', [])
        | map('extract', hostvars)
        | map(attribute='operation_patroni_identity.json.patroni.scope', default='')
        | list
      }}
    operation_patroni_names: >-
      {{
        groups.get('operation_patroni_members', [])
        | map('extract', hostvars)
        | map(attribute='operation_patroni_identity.json.patroni.name', default='')
        | list
      }}
  when: not operation_credentials_validate_only | default(false) | bool
  run_once: true # noqa run-once

- name: Bind live Patroni scope
  ansible.builtin.set_fact:
    patroni_cluster_name: >-
      {{
        hostvars[groups.get('operation_patroni_members', []) | first]
        ['operation_patroni_identity']['json']['patroni']['scope']
      }}
  when: not operation_credentials_validate_only | default(false) | bool

- name: Recheck live Patroni DCS topology before mutation
  become_user: postgres
  ansible.builtin.command:
    argv:
      - patronictl
      - -c
      - /etc/patroni/patroni.yml
      - list
      - "{{ patroni_cluster_name }}"
      - --format
      - json
  register: operation_patroni_dcs
  delegate_to: "{{ groups.get('operation_patroni_members', []) | first }}"
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/bin:/usr/local/bin"
  changed_when: false
  check_mode: false
  when: not operation_credentials_validate_only | default(false) | bool
  run_once: true # noqa run-once

- name: Require live DCS leader and expected members before mutation
  ansible.builtin.assert:
    that:
      - operation_patroni_dcs_members | selectattr('Role', 'equalto', 'Leader') | list | length == 1
      - operation_patroni_dcs_names == operation_patroni_expected_names
    fail_msg: Live Patroni DCS topology does not contain one leader and every current member.
  vars:
    operation_patroni_dcs_members: "{{ operation_patroni_dcs.stdout | from_json }}"
    operation_patroni_dcs_names: >-
      {{ operation_patroni_dcs_members | map(attribute='Member') | list | sort }}
    operation_patroni_expected_names: >-
      {{
        groups.get('operation_patroni_members', [])
        | map('extract', hostvars)
        | map(attribute='operation_patroni_identity.json.patroni.name')
        | list
        | sort
      }}
  when: not operation_credentials_validate_only | default(false) | bool
  run_once: true # noqa run-once
