---
- name: Validate declared operation credentials
  ansible.builtin.assert:
    that:
      - operation_required_credentials | default([]) | difference(['postgres_superuser', 'postgres_replication', 'patroni_restapi']) | length == 0
      - "'postgres_superuser' not in operation_required_credentials | default([]) or patroni_superuser_username | default('') | length > 0"
      - "'postgres_superuser' not in operation_required_credentials | default([]) or patroni_superuser_password | default('') | length > 0"
      - "'postgres_replication' not in operation_required_credentials | default([]) or patroni_replication_username | default('') | length > 0"
      - "'postgres_replication' not in operation_required_credentials | default([]) or patroni_replication_password | default('') | length > 0"
      - "'patroni_restapi' not in operation_required_credentials | default([]) or patroni_restapi_username | default('') | length > 0"
      - "'patroni_restapi' not in operation_required_credentials | default([]) or patroni_restapi_password | default('') | length > 0"
  no_log: true

- name: Authenticate PostgreSQL superuser before mutation
  become_user: postgres
  ansible.builtin.command:
    argv:
      - "{{ postgresql_bin_dir }}/psql"
      - -h
      - "127.0.0.1"
      - -p
      - "{{ postgresql_port | string }}"
      - -U
      - "{{ patroni_superuser_username }}"
      - -d
      - postgres
      - -tAXc
      - select 1
  environment:
    PGPASSWORD: "{{ patroni_superuser_password }}"
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - "'postgres_superuser' in operation_required_credentials | default([])"
    - not operation_credentials_validate_only | default(false) | bool
    - not new_node | default(false) | bool

- name: Authenticate PostgreSQL replication role before mutation
  become_user: postgres
  ansible.builtin.command:
    argv:
      - "{{ postgresql_bin_dir }}/psql"
      - "--dbname=host=127.0.0.1 port={{ postgresql_port }} dbname=postgres user={{ patroni_replication_username }} replication=database"
      - -tAXc
      - IDENTIFY_SYSTEM
  environment:
    PGPASSWORD: "{{ patroni_replication_password }}"
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - "'postgres_replication' in operation_required_credentials | default([])"
    - not operation_credentials_validate_only | default(false) | bool
    - not new_node | default(false) | bool

- name: Authenticate Patroni REST API before mutation
  ansible.builtin.uri:
    url: >-
      {{ patroni_restapi_protocol | default('https') }}://{{ patroni_restapi_connect_addr
        | default(patroni_bind_address | default(bind_address, true), true) }}:{{ patroni_restapi_port
        | default('8008') }}/config
    user: "{{ patroni_restapi_username }}"
    password: "{{ patroni_restapi_password }}"
    force_basic_auth: true
    status_code: 200
    ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
  environment:
    no_proxy: "{{ patroni_restapi_connect_addr | default(patroni_bind_address | default(bind_address, true), true) }}"
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - "'patroni_restapi' in operation_required_credentials | default([])"
    - not operation_credentials_validate_only | default(false) | bool
    - not new_node | default(false) | bool
