---
- name: Require one valid pgbackrest scheduler owner
  ansible.builtin.assert:
    that:
      - pgbackrest_scheduler_host | length > 0
      - pgbackrest_scheduler_host in (groups.get('postgres_cluster', []) + groups.get('pgbackrest', []))
  run_once: true

- name: Remove pgbackrest cron files from non-owner
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ pgbackrest_cron_jobs | map(attribute='file') | unique }}"
  when:
    - inventory_hostname != pgbackrest_scheduler_host
    - inventory_hostname in (groups.get('postgres_cluster', []) + groups.get('pgbackrest', []))

- name: Add pgbackrest cron jobs on database server
  ansible.builtin.include_role:
    name: vitabaks.autobase.cron
  vars:
    cron_jobs: "{{ pgbackrest_cron_jobs }}"
  when:
    - "'postgres_cluster' in group_names"
    - pgbackrest_repo_host | default('') | length < 1
    - inventory_hostname == pgbackrest_scheduler_host

- name: Add pgbackrest cron jobs on pgbackrest server
  ansible.builtin.include_role:
    name: vitabaks.autobase.cron
  vars:
    cron_jobs: "{{ pgbackrest_cron_jobs }}"
  when:
    - "'pgbackrest' in group_names"
    - pgbackrest_repo_host | default('') | length > 0
    - inventory_hostname == pgbackrest_scheduler_host
